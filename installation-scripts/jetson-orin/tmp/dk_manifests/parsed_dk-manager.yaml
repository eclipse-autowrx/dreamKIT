apiVersion: apps/v1
kind: Deployment
metadata:
  name: dk-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dk-manager
  template:
    metadata:
      labels:
        app: dk-manager
    spec:
      nodeSelector:
        kubernetes.io/hostname: xip
      hostNetwork: true
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      volumes:
      - name: dk-home
        hostPath: { path: /home/sdv-runtime/.dk }
      - name: docker-sock
        hostPath: { path: /var/run/docker.sock }
      containers:
      - name: dk-manager
        image: ghcr.io/eclipse-autowrx/dk_manager:latest
        imagePullPolicy: IfNotPresent  # Never try to pull
        env:
        - { name: USER, value: "sdv-runtime" }
        - { name: DOCKER_HUB_NAMESPACE, value: "ghcr.io/eclipse-autowrx" }
        - { name: ARCH, value: "arm64" }
        volumeMounts:
        - { name: dk-home,    mountPath: /app/.dk }
        - { name: docker-sock, mountPath: /var/run/docker.sock }
